# Update these values each week before running .claude/scripts/calculate_hr_zones.py.
method: karvonen

heart_rate:
  max: 185
  resting_average: 56.5
  # Lactate-threshold HR (Friel): last-20-min average of the 2026 races (~165) and 10K races of 10 years ago, age-corrected.
  # Used by calculate_threshold.py; re-check at each race.
  threshold: 165

pace:
  # Threshold pace, used as the IF (Intensity Factor) denominator for NGP-based
  # IF/TSS in garmin_sync.py. Median of the last three Tempo estimates in
  # health-log/threshold.md (6:11, 6:21, 6:15), replacing Garmin's 6:04 on 2026-10-18;
  # update when a real threshold test/race gives a better number.
  threshold_sec_per_km: 375  # 6:15/km

zones:
  - name: Zone 1
    min_percent: 50
    max_percent: 60
  - name: Zone 2
    min_percent: 60
    max_percent: 75
  - name: Zone 3
    min_percent: 75
    max_percent: 85
  - name: Zone 4
    min_percent: 85
    max_percent: 93
  - name: Zone 5
    min_percent: 93
    max_percent: 100