# Update these values each week before running .claude/scripts/calculate_hr_zones.py.
method: karvonen

heart_rate:
  max: 185
  resting_average: 57.8
  # Lactate-threshold HR (Friel): last-20-min average of the 2026 races (~165) and 10K races of 10 years ago, age-corrected.
  # Used by calculate_threshold.py; re-check at each race.
  threshold: 165

pace:
  # Threshold pace, used as the IF (Intensity Factor) denominator for NGP-based
  # IF/TSS in garmin_sync.py. Median of the last three Tempo estimates in
  # health-log/threshold.md (6:11, 6:21, 6:15), replacing Garmin's 6:04 on 2026-10-18;
  # update when a real threshold test/race gives a better number.
  threshold_sec_per_km: 375  # 6:15/km

power:
  # Garmin wrist running power (Forerunner 255): not comparable with Stryd or other brands.
  # Provisional threshold (2026-11-18): Rome 5K 294 W over 32' (~104% of threshold -> ~283 W)
  # and Tempo laps at HR 164-167 (286-294 W). Main method: power of Tempo blocks at
  # threshold HR (independent of endurance); ~30' races/tests confirm it. A ~1h race
  # (e.g. Best Woman 10K, 2026-12-06) is NOT a threshold test while the long run is
  # under 10-12 km: it is endurance-limited, so it may raise this value, never lower it.
  threshold_watts: 285
  # Same weight as the Garmin profile; power depends on it, change both only for a real change.
  weight_kg: 77.5
  # Zones calibrated on the athlete's own power/HR pairs, not generic tables: wrist power stays
  # high at slow paces (true easy run at HR 139 = 239 W = 84%), so Stryd-style
  # "easy = 65-80%" would label every easy run as moderate. Easy/long runs are still
  # decided on HR; power is a secondary metric for hills, short reps and race pacing.
  zones:
    - name: P1 Recovery
      min_percent: 0
      max_percent: 82
    - name: P2 Easy
      min_percent: 82
      max_percent: 90
    - name: P3 Steady
      min_percent: 90
      max_percent: 96
    - name: P4 Threshold
      min_percent: 96
      max_percent: 105
    - name: P5 Interval
      min_percent: 105
      max_percent: 118
    - name: P6 Repetition
      min_percent: 118
      max_percent: 1000

zones:
  - name: Zone 1
    min_percent: 50
    max_percent: 60
  - name: Zone 2
    min_percent: 60
    max_percent: 75
  - name: Zone 3
    min_percent: 75
    max_percent: 85
  - name: Zone 4
    min_percent: 85
    max_percent: 93
  - name: Zone 5
    min_percent: 93
    max_percent: 100